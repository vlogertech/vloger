name: CI

# Vérifie automatiquement, à chaque push et pull request, que le projet
# compile et passe le typecheck — le même cycle de vérifications
# (tsc + eslint) qui a été fait manuellement fichier par fichier lors
# de l'audit initial est désormais automatisé ici.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  shared:
    name: packages/shared — typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck --workspace=packages/shared

  web:
    name: apps/web — typecheck, lint, build
    runs-on: ubuntu-latest
    needs: shared
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # Non-bloquant pour l'instant : ~315 erreurs préexistantes dans les
      # composants shadcn/ui (typage forwardRef incompatible avec checkJs),
      # identifiées lors de l'audit initial, hors périmètre des correctifs
      # déjà livrés. À retirer "continue-on-error" une fois cette dette
      # résorbée pour que le typecheck redevienne bloquant.
      - run: npm run typecheck --workspace=apps/web
        continue-on-error: true
      - run: npm run lint --workspace=apps/web
      - run: npm run build --workspace=apps/web
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

  mobile:
    name: apps/mobile — typecheck
    runs-on: ubuntu-latest
    needs: shared
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck --workspace=apps/mobile